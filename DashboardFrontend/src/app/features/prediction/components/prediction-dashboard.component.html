<div class="prediction-dashboard">
  <!-- Header -->
  <div class="dashboard-header">
    <h1 class="page-title">Win Rate Prediction</h1>
    <p class="page-subtitle">使用 ML 模型預測遊戲勝率</p>
  </div>

  <!-- Error Alert -->
  @if (error()) {
    <app-error-alert [message]="error()!" (dismiss)="dismissError()"></app-error-alert>
  }

  <!-- Model Status -->
  <app-model-status
    [status]="modelStatus()"
    [isLoading]="isLoading()"
    (reload)="reloadModelStatus()">
  </app-model-status>

  <div class="dashboard-content" [class.model-unloaded]="!isModelLoaded()">
    <!-- Top Row: Form + Result -->
    <div class="top-row">
      <!-- Left: Prediction Form -->
      <div class="form-column">
        <section class="section-card">
          <h2 class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            遊戲狀態預測
          </h2>
          @if (!isModelLoaded()) {
            <div class="model-warning">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <span>ML 模型尚未載入，請先部署 ONNX 模型</span>
            </div>
          } @else {
            <app-game-state-prediction-form
              [isLoading]="isPredicting()"
              (submitPrediction)="onPredictionSubmit($event)">
            </app-game-state-prediction-form>
          }
        </section>
      </div>

      <!-- Right: Prediction Result -->
      <div class="result-column">
        @if (showResult() && predictionResult()) {
          <section class="section-card result-section">
            <div class="result-header">
              <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                預測結果
              </h2>
              <button class="btn-icon" (click)="hideResult()" title="隱藏結果">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <app-prediction-result-card [result]="predictionResult()!"></app-prediction-result-card>
          </section>
        } @else {
          <section class="section-card placeholder-card">
            <p class="placeholder-text">提交預測表單後，結果將顯示在這裡</p>
          </section>
        }
      </div>
    </div>

    <!-- Bottom Row: Level Analysis (Full Width) -->
    <div class="bottom-row">
      <section class="section-card">
        <h2 class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          等級分析
        </h2>
        <p class="section-description">分析不同英雄等級對勝率的影響</p>
        <app-level-analysis-chart
          [data]="levelAnalysis()"
          [isLoading]="isAnalyzing()"
          (analyze)="loadLevelAnalysis($event)">
        </app-level-analysis-chart>
      </section>
    </div>
  </div>
</div>
