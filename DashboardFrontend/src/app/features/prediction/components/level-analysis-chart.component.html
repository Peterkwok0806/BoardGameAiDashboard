<div class="level-analysis">
  <!-- Chart + Stats Row -->
  <div class="chart-stats-row">
    <!-- Chart Container -->
    <div class="chart-container">
      @if (isLoading()) {
        <div class="loading-overlay">
          <app-loading-spinner [size]="'md'"></app-loading-spinner>
          <span>分析中...</span>
        </div>
      } @else if (!hasData()) {
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <p>模型載入後即可查看等級分析</p>
        </div>
      } @else {
        <div class="chart-wrapper">
          <canvas baseChart [data]="chartData()" [options]="chartOptions" type="line"></canvas>
        </div>
      }
    </div>

    <!-- Stats Cards -->
    @if (hasData()) {
      <div class="stats-panel">
        <div class="stat-card">
          <span class="stat-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </span>
          <div class="stat-content">
            <span class="stat-label">最佳等級</span>
            <span class="stat-value">{{ stats().bestLevel }}</span>
          </div>
        </div>
        <div class="stat-card highlight">
          <span class="stat-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
              <polyline points="16 7 22 7 22 13"></polyline>
            </svg>
          </span>
          <div class="stat-content">
            <span class="stat-label">最高勝率</span>
            <span class="stat-value">{{ (stats().maxWinRate * 100).toFixed(1) }}%</span>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="20" x2="12" y2="10"></line>
              <line x1="18" y1="20" x2="18" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>
          </span>
          <div class="stat-content">
            <span class="stat-label">平均勝率</span>
            <span class="stat-value">{{ (stats().avgWinRate * 100).toFixed(1) }}%</span>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Analysis Parameters -->
  <div class="analysis-bar">
    <span class="bar-label">分析參數</span>
    <form [formGroup]="form" (ngSubmit)="onAnalyze()" class="params-row">
      <div class="param">
        <label for="heroLevel">英雄等級</label>
        <input type="number" id="heroLevel" formControlName="heroLevel" min="1" max="30" />
      </div>
      <div class="param">
        <label for="heroKills">擊殺數</label>
        <input type="number" id="heroKills" formControlName="heroKills" min="0" max="50" />
      </div>
      <div class="param">
        <label for="deaths">死亡數</label>
        <input type="number" id="deaths" formControlName="deaths" min="0" max="30" />
      </div>
      <div class="param">
        <label for="totalGold">金幣</label>
        <input type="number" id="totalGold" formControlName="totalGold" min="0" max="100000" step="1000" />
      </div>
      <div class="param">
        <label for="highestAtk">最高攻擊</label>
        <input type="number" id="highestAtk" formControlName="highestAtk" min="0" max="1000" />
      </div>
      <div class="param">
        <label for="highestDef">最高防禦</label>
        <input type="number" id="highestDef" formControlName="highestDef" min="0" max="500" />
      </div>
      <div class="param">
        <label for="highestSpeed">最高速度</label>
        <input type="number" id="highestSpeed" formControlName="highestSpeed" min="0" max="1000" />
      </div>
      <div class="param">
        <label for="playerCount">玩家數</label>
        <input type="number" id="playerCount" formControlName="playerCount" min="2" max="10" />
      </div>
      <button type="submit" class="btn-analyze" [disabled]="isLoading()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        重新分析
      </button>
    </form>
  </div>
</div>
